<?xml version="1.0" encoding="UTF-8"?>
<!-- Modern dam, inner art only. build-icon.py renders this and sets it inside the base game's gold ring (taken from
     buildicon_modbridge) so it sits with the shipped buildicon_* set. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<defs>
    <clipPath id="disc"><circle cx="128" cy="128" r="114"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15122b"/>
      <stop offset="0.55" stop-color="#2b2966"/>
      <stop offset="1" stop-color="#3a3f7a"/>
    </linearGradient>
    <linearGradient id="reservoir" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa6c4"/>
      <stop offset="1" stop-color="#4d6388"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d5cc"/>
      <stop offset="0.45" stop-color="#a7a298"/>
      <stop offset="1" stop-color="#5d5a55"/>
    </linearGradient>
    <linearGradient id="faceSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="0.28" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff1ff"/>
      <stop offset="0.6" stop-color="#9fc6e6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7496"/>
      <stop offset="1" stop-color="#1c2638"/>
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ede4"/>
      <stop offset="1" stop-color="#9c978d"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e8980"/>
      <stop offset="0.5" stop-color="#d8d3c8"/>
      <stop offset="1" stop-color="#6c6861"/>
    </linearGradient>
    <radialGradient id="mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  
    <linearGradient id="rock" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b9b2a4"/>
      <stop offset="0.5" stop-color="#8d8779"/>
      <stop offset="1" stop-color="#5d584e"/>
    </linearGradient>
    <linearGradient id="timber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7448"/>
      <stop offset="1" stop-color="#5d4527"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e5e6"/>
      <stop offset="0.5" stop-color="#b3b7ba"/>
      <stop offset="1" stop-color="#6e7376"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <path d="M0 104 C40 84 70 96 100 88 C130 80 160 92 190 84 C215 78 240 90 256 86 L256 120 L0 120 Z" fill="#1d1d3f"/>
    <path d="M0 102 C60 96 196 96 256 102 L256 128 L0 128 Z" fill="url(#reservoir)"/>
    <path d="M20 108 L70 106 M120 104 L170 104 M196 107 L236 108" stroke="#c9d8ea" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- concrete gravity dam: a straight crest, buttressed face, sluice gates and a powerhouse at the foot -->
    <path d="M-4 118 L260 118 L260 214 Q128 230 -4 214 Z" fill="url(#concrete)"/>
    <path d="M-4 118 L260 118 L260 130 L-4 130 Z" fill="#eef0f1"/>
    <g stroke="#6e7376" stroke-width="1.4" stroke-opacity="0.85">
      <path d="M-4 130 L260 130"/>
      <path d="M24 130 V210 M56 130 V212 M200 130 V212 M232 130 V210"/>
    </g>
    <!-- buttresses -->
    <g fill="#9aa0a4" fill-opacity="0.55">
      <path d="M8 130 L20 130 L28 212 L12 212 Z"/>
      <path d="M228 130 L240 130 L244 212 L232 212 Z"/>
    </g>
    <!-- sluice gates -->
    <g fill="#39404a" stroke="#22272e" stroke-width="1.4">
      <rect x="72" y="136" width="24" height="34" rx="2"/>
      <rect x="160" y="136" width="24" height="34" rx="2"/>
    </g>
    <g stroke="#cfd4d8" stroke-width="2" stroke-opacity="0.8">
      <path d="M72 144 H96 M72 152 H96 M72 160 H96"/>
      <path d="M160 144 H184 M160 152 H184 M160 160 H184"/>
    </g>
    <!-- gantry along the crest -->
    <g stroke="#7d848a" stroke-width="2.2">
      <path d="M-4 118 L260 118"/>
      <path d="M40 108 V118 M128 104 V118 M216 108 V118"/>
      <path d="M36 108 H220"/>
    </g>
    <!-- the spillway down the middle -->
    <path d="M108 122 L148 122 L152 214 L104 214 Z" fill="url(#spill)"/>
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="2">
      <path d="M116 128 C114 164 118 192 115 212"/>
      <path d="M128 128 C130 166 126 194 129 212"/>
      <path d="M140 128 C138 164 142 192 139 212"/>
    </g>
    <!-- powerhouse at the foot -->
    <g fill="#c6cace" stroke="#5e6468" stroke-width="1.6">
      <rect x="182" y="176" width="46" height="30" rx="2"/>
      <rect x="190" y="184" width="8" height="9" fill="#2b3138"/>
      <rect x="204" y="184" width="8" height="9" fill="#2b3138"/>
      <rect x="218" y="184" width="6" height="9" fill="#2b3138"/>
    </g>
    <path d="M-4 212 Q128 234 260 212 L260 260 L-4 260 Z" fill="url(#river)"/>
    <ellipse cx="128" cy="226" rx="46" ry="12" fill="url(#mist)"/>
    <ellipse cx="128" cy="222" rx="30" ry="7" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
